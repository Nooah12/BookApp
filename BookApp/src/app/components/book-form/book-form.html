<div class="container py-4">
  <div class="form-page">
    <div class="form-page-header">
      <a routerLink="/books" class="back-btn">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div>
        <h2>{{ isEdit ? 'Edit Book' : 'Add New Book' }}</h2>
        <p>{{ isEdit ? 'Update the book details below' : 'Fill in the details for your new book' }}</p>
      </div>
    </div>

    <div class="form-card">
      <form (ngSubmit)="submit()">
        <div class="form-floating mb-3">
          <input
            class="form-control"
            id="title"
            placeholder="Title"
            [(ngModel)]="book.title"
            name="title"
            required
          />
          <label for="title"><i class="fas fa-book me-2"></i>Title</label>
        </div>

        <div class="form-floating mb-3">
          <input
            class="form-control"
            id="author"
            placeholder="Author"
            [(ngModel)]="book.author"
            name="author"
            required
          />
          <label for="author"><i class="fas fa-pen-nib me-2"></i>Author</label>
        </div>

        <div class="form-floating mb-4">
          <input
            class="form-control"
            id="publishedDate"
            type="date"
            placeholder="Published date"
            [(ngModel)]="book.publishedDate"
            name="publishedDate"
            required
          />
          <label for="publishedDate"><i class="fas fa-calendar me-2"></i>Published date</label>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">
            <i class="fas fa-save me-1"></i> {{ isEdit ? 'Save changes' : 'Add book' }}
          </button>
          <a routerLink="/books" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>

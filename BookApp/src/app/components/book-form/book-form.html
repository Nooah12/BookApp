<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h2>{{ isEdit ? 'Edit Book' : 'Add New Book' }}</h2>
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <input class="form-control" placeholder="Title" [(ngModel)]="book.title" name="title" required />
        </div>
        <div class="mb-3">
          <input class="form-control" placeholder="Author" [(ngModel)]="book.author" name="author" required />
        </div>
        <div class="mb-3">
          <input class="form-control" type="date" [(ngModel)]="book.publishedDate" name="publishedDate" required />
        </div>
        <button class="btn btn-primary me-2" type="submit">
          <i class="fas fa-save"></i> Save
        </button>
        <a routerLink="/books" class="btn btn-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>

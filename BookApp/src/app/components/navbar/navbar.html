<nav class="app-navbar">
  <div class="container nav-inner">
    <a class="nav-brand" routerLink="/books" (click)="closeMenu()">
      <i class="fas fa-book-open"></i>
      <span>BookShelf</span>
    </a>

    <!-- Desktop links -->
    <div class="nav-links d-none d-md-flex">
      <a class="nav-link" routerLink="/books" routerLinkActive="active">
        <i class="fas fa-books"></i> Books
      </a>
      <a class="nav-link" routerLink="/quotes" routerLinkActive="active">
        <i class="fas fa-quote-left"></i> Quotes
      </a>
    </div>

    <!-- Desktop actions -->
    <div class="nav-actions d-none d-md-flex">
      <button class="icon-btn" (click)="theme.toggleDarkMode()" [title]="theme.darkMode ? 'Light mode' : 'Dark mode'">
        <i class="fas" [class.fa-sun]="theme.darkMode" [class.fa-moon]="!theme.darkMode"></i>
      </button>
      <button class="btn btn-outline-primary btn-sm" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>

    <!-- Mobile right side -->
    <div class="mobile-right d-flex d-md-none">
      <button class="icon-btn" (click)="theme.toggleDarkMode()">
        <i class="fas" [class.fa-sun]="theme.darkMode" [class.fa-moon]="!theme.darkMode"></i>
      </button>
      <button class="hamburger" (click)="toggleMenu()" [class.open]="menuOpen">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div class="mobile-menu" [class.open]="menuOpen">
    <a class="mobile-link" routerLink="/books" routerLinkActive="active" (click)="closeMenu()">
      <i class="fas fa-books"></i> Books
    </a>
    <a class="mobile-link" routerLink="/quotes" routerLinkActive="active" (click)="closeMenu()">
      <i class="fas fa-quote-left"></i> Quotes
    </a>
    <button class="mobile-link logout" (click)="logout(); closeMenu()">
      <i class="fas fa-sign-out-alt"></i> Logout
    </button>
  </div>
</nav>

<div class="container py-4">
  <div class="page-header">
    <h2><i class="fas fa-book-open me-2 text-primary"></i>My Books</h2>
    <a routerLink="/books/new" class="btn btn-primary">
      <i class="fas fa-plus me-1"></i> Add Book
    </a>
  </div>

  @if (books.length > 0) {
    <div class="books-grid">
      @for (book of books; track book.id) {
        <div class="book-card">
          <div class="book-spine"></div>
          <div class="book-content">
            <div class="book-meta">
              <span class="book-date">
                <i class="fas fa-calendar-alt me-1"></i>{{ book.publishedDate }}
              </span>
            </div>
            <h3 class="book-title">{{ book.title }}</h3>
            <p class="book-author"><i class="fas fa-pen-nib me-1"></i>{{ book.author }}</p>
            <div class="book-actions">
              <a [routerLink]="['/books/edit', book.id]" class="btn btn-sm btn-outline-primary">
                <i class="fas fa-edit"></i> Edit
              </a>
              <button class="btn btn-sm btn-outline-danger" (click)="delete(book.id!)">
                <i class="fas fa-trash"></i> Delete
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  } @else {
    <div class="empty-state">
      <i class="fas fa-book-open"></i>
      <p>No books yet — add your first one!</p>
    </div>
  }
</div>

<div class="container py-4">
  <div class="page-header">
    <h2><i class="fas fa-quote-left me-2 text-primary"></i>My Quotes</h2>
    <button class="btn btn-primary" (click)="showForm = !showForm">
      <i class="fas" [class.fa-plus]="!showForm" [class.fa-times]="showForm"></i>
      {{ showForm ? 'Cancel' : 'Add Quote' }}
    </button>
  </div>

  @if (showForm) {
    <div class="quote-form-card">
      <h5 class="form-title">{{ editingId ? 'Edit quote' : 'New quote' }}</h5>
      <form (ngSubmit)="submit()">
        <div class="form-floating mb-3">
          <textarea
            class="form-control"
            id="quoteText"
            placeholder="Quote text"
            [(ngModel)]="form.text"
            name="text"
            required
            style="height: 100px; resize: none;"
          ></textarea>
          <label for="quoteText">Quote text</label>
        </div>
        <div class="form-floating mb-3">
          <input
            class="form-control"
            id="quoteAuthor"
            placeholder="Author"
            [(ngModel)]="form.author"
            name="author"
            required
          />
          <label for="quoteAuthor"><i class="fas fa-pen-nib me-1"></i>Author</label>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">
            <i class="fas fa-save me-1"></i> Save
          </button>
          <button class="btn btn-outline-secondary" type="button" (click)="cancelForm()">
            Cancel
          </button>
        </div>
      </form>
    </div>
  }

  <div class="quotes-list">
    @for (quote of quotes; track quote.id) {
      <div class="quote-card">
        @if (editingId !== quote.id) {
          <span class="quote-mark">"</span>
          <p class="quote-text">{{ quote.text }}</p>
          <div class="quote-footer">
            <span class="quote-author">— {{ quote.author }}</span>
            <div class="quote-actions">
              <button class="icon-action" title="Edit" (click)="startEdit(quote)">
                <i class="fas fa-edit"></i>
              </button>
              <button class="icon-action danger" title="Delete" (click)="delete(quote.id!)">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
        } @else {
          <form (ngSubmit)="saveEdit(quote.id!)">
            <div class="form-floating mb-3">
              <textarea
                class="form-control"
                id="editText"
                placeholder="Quote text"
                [(ngModel)]="form.text"
                name="editText"
                required
                style="height: 90px; resize: none;"
              ></textarea>
              <label for="editText">Quote text</label>
            </div>
            <div class="form-floating mb-3">
              <input
                class="form-control"
                id="editAuthor"
                placeholder="Author"
                [(ngModel)]="form.author"
                name="editAuthor"
                required
              />
              <label for="editAuthor">Author</label>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary btn-sm" type="submit">
                <i class="fas fa-save me-1"></i> Save
              </button>
              <button class="btn btn-outline-secondary btn-sm" type="button" (click)="cancelForm()">
                Cancel
              </button>
            </div>
          </form>
        }
      </div>
    } @empty {
      <div class="empty-state">
        <i class="fas fa-quote-left"></i>
        <p>No quotes yet — save something inspiring!</p>
      </div>
    }
  </div>
</div>

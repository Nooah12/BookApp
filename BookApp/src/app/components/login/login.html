<div class="container d-flex justify-content-center align-items-center min-vh-80"> 
  <div class="col-11 col-sm-8 col-md-6 col-lg-3">
    <div class="card shadow-lg p-4">
        <h2 class="mb-4">Login</h2>
        <form (ngSubmit)="login()">
          <div class="mb-3">
            <input class="form-control" placeholder="Username" [(ngModel)]="username" name="username" required />
          </div>
          <div class="mb-3">
            <input class="form-control" type="password" placeholder="Password" [(ngModel)]="password" name="password" required />
          </div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
          <p class="mt-3 text-center">No account? <a routerLink="/register">Register here</a></p>
        </form>
      </div>
    </div>
</div>
